<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LumenOps</title>
<style>
:root{--bg:#173b78;--cd:#102d5b;--tx:#e7eef7;--mu:#afc0d8;--ln:#3b5f95;--hd:#ffe08a;--bt:#214b83;--so:#274879;--or:#ffd34e;--rd:#e56878;--am:#e8ba47;--gr:#43c78a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f1f4f9;--cd:#fff;--tx:#1b2536;--mu:#667085;--ln:#d8dfe8;--hd:#1f3a5f;--bt:#1f3a5f;--so:#eaf1fb;--or:#e07b1a;--rd:#c0392b;--am:#d68910;--gr:#2e8b57;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#173b78;--cd:#102d5b;--tx:#e7eef7;--mu:#afc0d8;--ln:#3b5f95;--hd:#ffe08a;--bt:#214b83;--so:#274879;--or:#ffd34e;--rd:#e56878;--am:#e8ba47;--gr:#43c78a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#173b78;--cd:#102d5b;--tx:#e7eef7;--mu:#afc0d8;--ln:#3b5f95;--hd:#ffe08a;--bt:#214b83;--so:#274879;--or:#ffd34e;--rd:#e56878;--am:#e8ba47;--gr:#43c78a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,"Noto Sans Kannada","Nirmala UI",Tunga,Helvetica,sans-serif;line-height:1.5}
.w{max-width:900px;margin:0 auto;padding:16px 16px 40px}
h1{margin:0;color:var(--hd);font-size:30px}h2{margin:0 0 6px;color:var(--hd);font-size:20px}
.m{color:var(--mu);font-size:14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.top b{font-size:20px;color:var(--hd);flex:1}
.chip{background:var(--or);color:#102547;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:bold}
button,select{font:inherit;font-size:15px;padding:11px 13px;border-radius:8px;border:1px solid var(--ln);background:var(--cd);color:var(--tx)}
button{cursor:pointer}button.b{background:var(--or);color:#102547;border:0;font-weight:bold}button.w2{width:100%;margin-top:8px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.land{text-align:center;padding-top:26px}.land p{margin:6px 0 22px}
.rc{display:block;width:100%;text-align:left;padding:18px;margin-top:12px;border:1px solid var(--ln);border-left:6px solid var(--or);border-radius:10px;background:var(--cd)}
.rc b{display:block;font-size:19px;color:var(--hd)}.rc span{color:var(--mu);font-size:14px}.rc:hover{background:var(--so)}
.flow{margin-top:24px;font-size:14px;color:var(--mu)}.flow b{color:var(--tx)}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px}
.ph{max-width:460px;margin:0 auto}.ph label{display:block;margin-top:12px;font-size:14px;color:var(--mu)}.ph select{width:100%;margin-top:4px}
.bd{color:#fff;font-size:12px;padding:2px 9px;border-radius:10px;margin-left:6px}.High{background:var(--rd)}.Medium{background:var(--am);color:#102547}.Low{background:var(--gr)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row select{flex:1;min-width:140px}
.st{display:flex;gap:6px;margin:12px 0;font-size:13px}.st i{flex:1;text-align:center;padding:7px 2px;border:1px solid var(--ln);border-radius:6px;font-style:normal;color:var(--mu)}.st i.o{background:var(--gr);color:#fff;border-color:var(--gr);font-weight:bold}
.sec{margin:20px 0 8px;font-size:15px;font-weight:bold;color:var(--hd)}
.note{background:color-mix(in srgb,var(--or) 14%,var(--cd));border-left:4px solid var(--or);padding:9px 12px;border-radius:6px;font-size:13px;margin-top:10px}
.ft{font-size:12px;color:var(--mu);margin-top:26px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{flex:1;min-width:110px}.tabs button.on{background:var(--bt);color:#fff;border-color:var(--or)}
input{font:inherit;font-size:15px;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--tx);width:100%;margin-top:4px;box-sizing:border-box}
.bars{display:flex;gap:8px;align-items:flex-end;height:100px;margin:22px 0 4px}.bars div{flex:1;background:var(--hd);border-radius:4px 4px 0 0;opacity:.8;position:relative}.bars span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--mu)}
.mons{display:flex;gap:8px;font-size:11px;color:var(--mu)}.mons span{flex:1;text-align:center}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:left}
.paid{color:var(--gr);font-weight:bold}.due{color:var(--rd);font-weight:bold}
svg{width:100%;height:auto;display:block;border-radius:8px;background:var(--so)}
.rk{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:3px}.rk i{display:block;height:100%}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}.stars button{padding:6px 12px;margin-right:4px}.lang{position:fixed;bottom:12px;right:12px;z-index:5;display:flex;gap:4px;background:var(--or);border:1px solid #ffe0a3;padding:4px;border-radius:22px;box-shadow:0 2px 12px rgba(0,0,0,.2)}.lang button{padding:6px 14px;border-radius:18px;border:0;font-size:14px;background:transparent;color:#102547}.lang button.on{background:#173b78;color:#fff}textarea{font:inherit;font-size:15px;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--tx);width:100%;box-sizing:border-box;margin-top:4px}
:root{--g1:#173b78;--g2:#173b78;--sc:#6683ab}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#173b78;--g2:#173b78;--sc:#6683ab}}
:root[data-theme="dark"]{--g1:#173b78;--g2:#173b78;--sc:#6683ab}
:root[data-theme="light"]{--g1:#e6eefa;--g2:#f8fafd;--sc:#1f3a5f}
html{background:var(--g2)}body{background:transparent;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 88% 12%,rgba(255,204,62,.55),transparent 38%),radial-gradient(ellipse at 12% 82%,rgba(255,210,90,.2),transparent 30%),linear-gradient(135deg,var(--g1),var(--g2))}
.bg svg{position:absolute;left:0;bottom:0;width:100%;height:100%;border-radius:0;background:none}
.hid{position:absolute;width:0;height:0}
.hero{max-width:430px;width:100%;height:auto;margin:0 auto;display:block;background:none;border-radius:0}
.ti{width:18px;height:30px;display:inline-block;vertical-align:middle;margin-right:6px;background:none;border-radius:0}
.bolt{display:inline-block;animation:zap 2.4s ease-in-out infinite}
.c{background:color-mix(in srgb,var(--cd) 93%,transparent);backdrop-filter:blur(6px);transition:transform .2s,box-shadow .2s}
.c:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,35,70,.14)}
button{transition:transform .15s,box-shadow .15s,background .2s}
button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.14)}button:active{transform:none}
.rc{transition:transform .2s,background .2s,box-shadow .2s}.rc:hover{transform:translateX(6px);box-shadow:0 6px 18px rgba(15,35,70,.14)}
.fresh .land>*,.fresh .c,.fresh .top,.fresh h2,.fresh .tabs,.fresh .sec{animation:up .5s both}
.fresh .rc:nth-of-type(1){animation-delay:.12s}.fresh .rc:nth-of-type(2){animation-delay:.22s}.fresh .rc:nth-of-type(3){animation-delay:.32s}
.fresh .c:nth-of-type(2){animation-delay:.08s}.fresh .c:nth-of-type(3){animation-delay:.16s}.fresh .c:nth-of-type(4){animation-delay:.24s}
.bars div{transform-origin:bottom;animation:gr .9s both}.st i.o{animation:pop .45s both}
.chip{transition:background .2s}.note{animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes gr{from{transform:scaleY(0)}}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes zap{0%,100%{transform:scale(1);filter:none}45%{transform:scale(1.25) rotate(-8deg);filter:drop-shadow(0 0 6px #f5a524)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<svg class="hid" aria-hidden="true"><defs>
<symbol id="py" viewBox="0 0 100 220"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M28 218L46 30H54L72 218M36 160H64M41 112H59M44 70H56M30 150L62 112M70 150L38 112M36 112L56 70M64 112L44 70M10 48H90M20 78H80M10 48V56M90 48V56M20 78V86M80 78V86"/></g></symbol>
<symbol id="tr" viewBox="0 0 70 120"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M35 118V70M6 18H64"/><rect x="14" y="42" width="42" height="40" rx="6"/><path d="M22 42V82M30 42V82M38 42V82M46 42V82M16 36H54M18 10V18M35 10V18M52 10V18M12 8H24M29 8H41M46 8H58"/></g></symbol>
</defs></svg>
<div class="bg" aria-hidden="true"><svg viewBox="0 0 1200 500" preserveAspectRatio="xMidYMax slice">
<g style="color:var(--sc)" opacity=".2" fill="none" stroke="currentColor" stroke-width="2">
<path d="M0 497H1200" stroke-width="3"/>
<g fill="currentColor" stroke="none" opacity=".5"><rect x="20" y="410" width="50" height="87"/><rect x="82" y="370" width="38" height="127"/><rect x="540" y="420" width="60" height="77"/><rect x="610" y="385" width="36" height="112"/><rect x="1080" y="400" width="55" height="97"/><rect x="1142" y="430" width="40" height="67"/></g>
<use href="#py" x="60" y="237" width="120" height="260"/><use href="#py" x="360" y="237" width="120" height="260"/><use href="#py" x="660" y="237" width="120" height="260"/><use href="#py" x="960" y="237" width="120" height="260"/>
<use href="#tr" x="262" y="401" width="52" height="96"/><use href="#tr" x="842" y="401" width="52" height="96"/>
<path d="M168 294Q270 332 372 294M156 329Q270 367 384 329M468 294Q570 332 672 294M456 329Q570 367 684 329M768 294Q870 332 972 294M756 329Q870 367 984 329"/>
</g>
<g fill="#f5a524" opacity=".85">
<circle r="3.5"><animateMotion dur="5s" repeatCount="indefinite" path="M168 294Q270 332 372 294"/></circle>
<circle r="3.5"><animateMotion dur="6.5s" repeatCount="indefinite" path="M156 329Q270 367 384 329"/></circle>
<circle r="3.5"><animateMotion dur="5.5s" repeatCount="indefinite" path="M468 294Q570 332 672 294"/></circle>
<circle r="3.5"><animateMotion dur="7s" repeatCount="indefinite" path="M456 329Q570 367 684 329"/></circle>
<circle r="3.5"><animateMotion dur="6s" repeatCount="indefinite" path="M768 294Q870 332 972 294"/></circle>
<circle r="3.5"><animateMotion dur="5s" repeatCount="indefinite" path="M756 329Q870 367 984 329"/></circle>
<rect x="30" y="425" width="6" height="6"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></rect>
<rect x="95" y="390" width="6" height="6"><animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite"/></rect>
<rect x="620" y="405" width="6" height="6"><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/></rect>
<rect x="1095" y="420" width="6" height="6"><animate attributeName="opacity" values="1;0;1" dur="2.8s" repeatCount="indefinite"/></rect>
</g></svg></div>
<div class="w" id="app"></div>
<div class="lang" role="group" aria-label="Language"><button data-a="lang" data-l="en">English</button><button data-a="lang" data-l="kn">ಕನ್ನಡ</button></div>
<script>
const ORD=["Pending","Crew assigned","Completed"],K=111320*Math.cos(12.97*Math.PI/180);
const HOSP=[12.9254,77.5836],SP={A:[12.925,77.583],B:[12.969,77.75],C:[13.035,77.597],T:[12.9108,77.6398],S:[13.0005,77.5505],I:[12.9852,77.7002]},PLACES={A:"Near a hospital",T:"Near a temple",S:"Near a school or college",I:"Near an industry",B:"Near a water pumping station",C:"Planned maintenance area"},ISSUES=["No power","Partial power","Low voltage","Fire or sparks near a street light or transformer","Other (describe it)"];
const DT=[{id:"DT-A1",f:"F-11",la:12.9252,ln:77.5832,fail:1,m:95},{id:"DT-B1",f:"F-22",la:12.9693,ln:77.7502,fail:4,m:230},{id:"DT-C1",f:"F-33",la:13.0348,ln:77.5972,fail:0,m:40},{id:"DT-L1",f:"F-44",la:12.9105,ln:77.6395,fail:1,m:310},{id:"DT-L2",f:"F-44",la:13.0004,ln:77.5503,fail:0,m:60},{id:"DT-I1",f:"F-55",la:12.9852,ln:77.7002,fail:2,m:160}];
const CREWS=["Crew 1","Crew 2","Crew 3","Crew 4"],CAUSES=["Transformer fault","Line fault","Fuse or low-voltage fault","Planned work","Other"];
const dm=(a,b,c,d)=>Math.hypot((a-c)*110540,(b-d)*K);
let sd=7;const rnd=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let C=[],nid=1,mine=null,role="",utab="rep",atab="inc",sel=null,trip={},wo={},paid={},apps=[],rated={},appErr="",pending="",sess=null,fails=0,lockUntil=0,authMsg="",log=[],formErr="",draft={},appDraft={},billErr="",billRR="",BILLDB={"RR-DEMO-1042":{units:[118,126,141,152,133,127],paid:null}};
const add=(la,ln,min)=>{const c={id:nid++,lat:la,lng:ln,t:Date.now()-min*6e4,st:"Pending",ty:"No power",crew:"",cause:""};C.push(c);return c};
function seed(){C=[];nid=1;mine=null;
[[12.925,77.583,42,177,150,.0012],[12.969,77.75,11,57,40,.001],[13.035,77.597,3,17,15,.0006]].forEach(([a,b,n,s,sp,j])=>{for(let i=0;i<n;i++)add(a+(rnd()*2-1)*j,b+(rnd()*2-1)*j,s-rnd()*sp)});add(12.91,77.64,7);add(13,77.55,2)}
function build(){const now=Date.now(),n=C.length,P=C.map(c=>[c.lng*K,c.lat*110540,c.t/6e4*(250/90)]),lab=Array(n).fill(-2);let cl=0;
const nb=i=>{const r=[];for(let j=0;j<n;j++)if(Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1],P[i][2]-P[j][2])<=250)r.push(j);return r};
for(let i=0;i<n;i++){if(lab[i]!==-2)continue;const N=nb(i);if(N.length<2){lab[i]=-1;continue}lab[i]=cl;const q=[...N];
while(q.length){const j=q.pop();if(lab[j]===-1)lab[j]=cl;if(lab[j]!==-2)continue;lab[j]=cl;const M=nb(j);if(M.length>=2)q.push(...M)}cl++}
const g={};C.forEach((c,i)=>{const k=lab[i]<0?"n"+i:lab[i];(g[k]=g[k]||[]).push(c)});
const I=Object.values(g).map(M=>{const la=M.reduce((s,c)=>s+c.lat,0)/M.length,ln=M.reduce((s,c)=>s+c.lng,0)/M.length,dur=(now-Math.min(...M.map(c=>c.t)))/6e4,
hosp=dm(la,ln,HOSP[0],HOSP[1])<=300,fire=M.some(c=>c.ty&&c.ty.startsWith("Fire")),sc=Math.min(M.length/30,1)*40+Math.min(dur/180,1)*30+(hosp?30:0)+(fire?40:0);
let dt=null,best=600;DT.forEach(d=>{const x=dm(la,ln,d.la,d.ln);if(x<best){best=x;dt=d}});
return{id:"INC-"+String(Math.min(...M.map(c=>c.id))).padStart(4,"0"),M,la,ln,n:M.length,dur,hosp,sc,dt,pl:dm(la,ln,13.035,77.597)<=600,fire,place:(M.find(c=>c.place)||{}).place,oth:[...new Set(M.filter(c=>c.other).map(c=>c.other))].slice(0,2),pr:fire||sc>=55?"High":sc>=20?"Medium":"Low",
st:ORD[Math.min(...M.map(c=>ORD.indexOf(c.st)))],crew:M[0].crew,cause:M[0].cause}});
return I.sort((a,b)=>b.sc-a.sc)}
const fm=m=>m<60?Math.round(m)+" min":Math.floor(m/60)+"h "+Math.round(m%60)+"m";
const card=(i,body)=>`<div class="c"><b>${i.id}</b><span class="bd ${i.pr}">${i.pr}</span>${i.fire?`<span class="bd High" style="margin-left:4px">Fire</span>`:""}${i.place?`<div class="m">${esc(i.place)}</div>`:""}${i.oth.length?`<div class="m">Reported: ${i.oth.map(t=>"“"+esc(t)+"”").join(", ")}</div>`:""}<div class="m">${i.n} ${i.n===1?"report":"reports"} · ${fm(i.dur)} since first report${i.hosp?" · hospital nearby":""}</div>${i.dt?`<div class="m">Probable transformer: ${i.dt.id} (feeder ${i.dt.f})</div>`:""}${body}</div>`;
const opts=(a,sel)=>a.map(x=>`<option value="${x}"${x===sel?" selected":""}>${x}</option>`).join("");
const MSG={Pending:"Received. An admin will assign a crew.","Crew assigned":"{c} is on the way to your area.",Completed:"Work completed and power restored. If it is still out, please report again."};
const HERO=`<svg class="hero" viewBox="0 0 400 170" aria-hidden="true" style="color:var(--hd)"><path d="M10 160H390" stroke="currentColor" stroke-width="3"/>
<use href="#py" x="10" y="40" width="80" height="120"/><use href="#tr" x="170" y="50" width="60" height="110"/>
<path d="M330 160V120L350 105L370 120V160Z" fill="none" stroke="currentColor" stroke-width="3"/>
<path d="M82 66Q128 92 175 66M225 66Q300 72 350 105" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M200 6L190 30H199L194 50L212 24H203Z" fill="#f5a524"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></path>
<rect x="343" y="128" width="14" height="14" fill="#f5a524"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/></rect>
<g fill="#f5a524"><circle r="3.5"><animateMotion dur="3s" repeatCount="indefinite" path="M82 66Q128 92 175 66"/></circle><circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" path="M225 66Q300 72 350 105"/></circle></g></svg>`;
function view(){const I=build(),R={user:"User",admin:"Admin",sup:"Supervisor"};
if(pending)return loginView();if(!role)return`<div class="land">${HERO}<h1>⚡ LumenOps</h1><p class="m">Smarter outage handling for BESCOM. Who are you?</p>
<button class="rc" data-a="role" data-r="user"><b>I’m a user</b><span>Report a problem, view and pay your bill, apply for a new connection</span></button>
<button class="rc" data-a="role" data-r="admin"><b>Admin</b><span>Assign crews, see the map and insights, review connection requests</span></button>
<button class="rc" data-a="role" data-r="sup"><b>Supervisor</b><span>Check the finished work and mark it completed</span></button>
<p class="flow"><b>How it works:</b> user reports, admin assigns a crew, the crew does the work, supervisor marks it completed, and the user sees the update.</p>
${authMsg&&!pending?`<div class="note">${esc(authMsg)}</div>`:""}<p class="ft">Admins and supervisors must sign in. Demo accounts: admin / Admin@demo1 and supervisor / Super@demo1. This login only imitates the real one: in the real system the check happens on the server and passwords are never shown.</p></div>`;
const top=`<div class="top"><b><span class="bolt">⚡</span> LumenOps</b><span class="chip">${sess?esc(sess.user)+" · "+R[role]:R[role]}</span><button data-a="out">${sess?"Sign out":"Switch role"}</button></div>`;
if(role==="user"){if(utab==="bill")return top+utabs()+billView();if(utab==="new")return top+utabs()+newView();const my=mine&&C.find(c=>c.id===mine),inc=my&&I.find(i=>i.M.includes(my));
return top+utabs()+`<div class="ph"><div class="c"><h2>Report a power problem</h2><label for="ty">What issue are you facing?</label><select id="ty">${opts(ISSUES,draft.ty)}</select>
<div id="firew" class="note" style="display:${(draft.ty||"").startsWith("Fire")?"block":"none"};border-left-color:var(--rd)"><b>Fire is an emergency.</b> Keep away from the equipment and do not touch wires. Call 101 (fire) or 112 (emergency) first, then report it here.</div>
<div id="othw" style="display:${(draft.ty||"").startsWith("Other")?"block":"none"}"><label class="m" for="ot" style="display:block;margin-top:8px">Describe the problem you are facing</label><textarea id="ot" rows="3" maxlength="200">${esc(draft.ot||"")}</textarea></div>
<label for="sp">Where are you?</label><select id="sp">${Object.entries(PLACES).map(([k,l])=>`<option value="${k}"${draft.sp===k?" selected":""}>${l}</option>`).join("")}<option value="X"${draft.sp==="X"?" selected":""}>Other (type a landmark)</option></select>
